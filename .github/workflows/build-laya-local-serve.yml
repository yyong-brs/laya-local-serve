name: Build laya-local-serve image

# Builds the GPU image from Dockerfile_new and pushes it to GHCR so it can be
# pulled once (on a machine with internet) and `docker save`/`load`ed into the
# air-gapped deployment host. Building here avoids the WSL2 2 GB OOM that breaks
# the local `COPY --from=build /opt/venv` / `pip install torch` steps.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile_new'
      - 'docker/**'
      - 'laya/**'
      - 'pyproject.toml'
      - 'setup.py'
  workflow_dispatch:
    inputs:
      torch_index:
        description: 'CUDA index (cu128 for most NVIDIA GPUs, cu130 for DGX Spark/GB10 arm64)'
        required: false
        default: 'cu128'
      torch_version:
        description: 'torch version to install'
        required: false
        default: '2.11.0'

permissions:
  contents: read
  packages: write   # required to push to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/laya-local-serve

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_new
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            TORCH_INDEX=${{ github.event.inputs.torch_index || 'cu128' }}
            TORCH_VERSION=${{ github.event.inputs.torch_version || '2.11.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
