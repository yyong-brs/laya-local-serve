name: Build laya-local-serve image

# Builds the GPU image from Dockerfile_new and pushes it to GHCR so it can be
# pulled once (on a machine with internet) and `docker save`/`load`ed into the
# air-gapped deployment host. Building here avoids the WSL2 2 GB OOM that breaks
# the local `COPY --from=build /opt/venv` / `pip install torch` steps.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile_new'
      - 'docker/**'
      - 'laya/**'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      torch_index:
        description: 'CUDA index (cu128 for most NVIDIA GPUs, cu130 for DGX Spark/GB10 arm64)'
        required: false
        default: 'cu128'
      torch_version:
        description: 'torch version to install'
        required: false
        default: '2.11.0'

permissions:
  contents: read
  packages: write   # required to push to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/laya-local-serve
  # Aliyun ACR (optional). Set the three ALIYUN_* secrets below to also mirror
  # the built image to your Alibaba Cloud registry for fast domestic pulls.
  # When ALIYUN_USERNAME is empty the Aliyun steps are skipped automatically.
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE || github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub-hosted ubuntu-latest runners only have ~25 GB disk and ship with
      # large toolchains we never use (Android SDK, dotnet, Haskell, Swift...).
      # Building the torch cu128 + nvidia-* image fills the disk and the run dies
      # with "No space left on device" on the runner's own log path. Free it first.
      - name: Free disk space on runner
        run: |
          echo "Disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/*
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/mono*
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt-get clean -y 2>/dev/null || true
          echo "Disk after:"; df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        if: ${{ secrets.ALIYUN_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_new
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            TORCH_INDEX=${{ github.event.inputs.torch_index || 'cu128' }}
            TORCH_VERSION=${{ github.event.inputs.torch_version || '2.11.0' }}
          cache-from: type=gha
          cache-to: type=gha

      # Mirror the just-built image to Aliyun ACR by copying the manifest+blobs
      # (no rebuild). Skipped automatically when ALIYUN_USERNAME is unset.
      - name: Copy image to Aliyun ACR
        if: ${{ secrets.ALIYUN_USERNAME != '' }}
        run: |
          docker buildx imagetools create \
            --tags ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/laya-local-serve:latest \
            --tags ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/laya-local-serve:${{ github.sha }} \
            ${{ env.IMAGE }}:latest
